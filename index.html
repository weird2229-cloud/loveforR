<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For R ❤️</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ff758c,#ff7eb3);
        overflow:hidden;
    }

    .container{
        text-align:center;
        color:white;
        z-index:2;
        padding:20px;
    }

    h1{
        font-size:4rem;
        margin-bottom:15px;
        animation: glow 2s infinite alternate;
    }

    p{
        font-size:1.3rem;
        max-width:600px;
        line-height:1.6;
    }

    @keyframes glow{
        from{
            text-shadow:0 0 10px white;
        }
        to{
            text-shadow:0 0 25px white, 0 0 40px pink;
        }
    }

    .heart{
        position:absolute;
        color:white;
        font-size:20px;
        animation: float 8s linear infinite;
        opacity:0.7;
    }

    @keyframes float{
        from{
            transform:translateY(100vh);
        }
        to{
            transform:translateY(-120px);
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>I Love You, R ❤️</h1>
    <p>
        Every day feels brighter because of you.
        Thank you for being part of my life.
        This little website is dedicated to you.
    </p>
</div>

<script>
for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
